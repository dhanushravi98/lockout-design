<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:0;width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><sc-for list="{{ items }}" as="e" hint-placeholder-count="3"><div style="display:flex;gap:14px"><div style="flex:none;width:12px;display:flex;flex-direction:column;align-items:center"><span style="{{ e.dotStyle }}"></span><div style="{{ e.lineStyle }}"></div></div><div style="display:flex;flex-direction:column;gap:2px;min-width:0;padding-bottom:18px"><span style="font-size:14px;color:#111827;line-height:1.4;font-weight:{{ e.weight }}">{{ e.text }}</span><span style="font-size:12px;color:#6b7280">{{ e.meta }}</span><sc-if value="{{ e.hasFile }}" hint-placeholder-val="{{ false }}"><div onClick="{{ e.open }}" role="button" aria-label="Open attachment {{ e.fileName }}" style="margin-top:6px;display:flex;flex-direction:column;gap:6px;width:fit-content;max-width:100%;cursor:pointer"><sc-if value="{{ e.isImg }}" hint-placeholder-val="{{ false }}"><div class="lo-tl-thumb" style="width:168px;height:112px;box-sizing:border-box;border-radius:10px;border:1px solid #e5e7eb;background:#f4f6f9 {{ e.bg }};transition:border-color .12s"></div></sc-if><span class="lo-tl-chip" style="display:inline-flex;align-items:center;gap:6px;width:fit-content;max-width:100%;background:#eaeef5;color:#25395c;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;transition:background .12s"><dc-import name="Icon" icon="{{ e.fileIcon }}" weight="regular" size="13" color="#25395c" hint-size="13px,13px"></dc-import><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ e.fileName }}</span><sc-if value="{{ e.hasSize }}" hint-placeholder-val="{{ false }}"><span style="flex:none;font-weight:500"> · {{ e.fileSize }}</span></sc-if></span></div></sc-if></div></div></sc-for>
<sc-if value="{{ showView }}" hint-placeholder-val="{{ false }}"><dc-import name="ModalShell" title="{{ v.fileName }}" subtitle="{{ v.sub }}" width="720" hideFooter="{{ true }}" onClose="{{ closeView }}" hint-size="0px,0px">
<sc-if value="{{ v.isImg }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;justify-content:center;background:#f4f6f9;border-radius:12px;padding:12px"><img src="{{ v.url }}" alt="{{ v.fileName }}" style="max-width:100%;max-height:56vh;object-fit:contain;border-radius:8px;display:block"></div></sc-if>
<sc-if value="{{ v.noPrev }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;align-items:center;gap:10px;background:#f4f6f9;border-radius:12px;padding:36px 20px;text-align:center"><dc-import name="Icon" icon="file-text" weight="regular" size="40" color="#9aa1ac" hint-size="40px,40px"></dc-import><span style="font-size:14px;color:#4b5563;line-height:1.5">{{ v.noPrevText }}</span></div></sc-if>
<sc-if value="{{ v.canDl }}" hint-placeholder-val="{{ false }}"><div style="display:flex;justify-content:flex-end"><a href="{{ v.url }}" download="{{ v.fileName }}" style="height:38px;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;padding:0 20px;border-radius:999px;border:1.5px solid #25395c;background:#fff;color:#25395c;font-size:14px;font-weight:700;text-decoration:none"><dc-import name="Icon" icon="download-simple" weight="regular" size="16" color="#25395c" hint-size="16px,16px"></dc-import>Download</a></div></sc-if>
</dc-import></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:240},&quot;events&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ text: string, meta: string, dot?: string, fileName?: string, fileUrl?: string, fileSize?: number | string }[]&quot;}}">
class Component extends DCLogic {
  state = { view: -1 };
  fs(n) { return typeof n === 'number' ? (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB') : String(n || ''); }
  renderVals() {
    const ev = Array.isArray(this.props.events) ? this.props.events : [];
    const real = u => !!u && u !== '#';
    const img = e => /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(e.fileName || '') && real(e.fileUrl);
    const items = ev.map((e, i, arr) => ({ text: e.text || '', meta: e.meta || '', weight: i === 0 ? 700 : 400,
      hasFile: !!e.fileName, fileName: e.fileName || '', fileSize: this.fs(e.fileSize), hasSize: !!e.fileSize, isImg: img(e), bg: img(e) ? 'center / cover no-repeat url("' + encodeURI(e.fileUrl) + '")' : '',
      fileIcon: /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(e.fileName || '') ? 'image' : 'paperclip',
      open: () => this.setState({ view: i }),
      dotStyle: 'margin-top:4px;flex:none;width:12px;height:12px;border-radius:999px;background:' + (e.dot || '#25395c') + (i === 0 ? ';box-shadow:0 0 0 4px #eaeef5' : ''),
      lineStyle: i === arr.length - 1 ? 'display:none' : 'flex:1;width:2px;background:#dfe3ea;margin:6px 0 2px;min-height:20px' }));
    const cur = this.state.view >= 0 ? ev[this.state.view] : null, ok = !!cur && !!cur.fileName;
    const v = ok ? { fileName: cur.fileName, url: real(cur.fileUrl) ? cur.fileUrl : '', sub: [this.fs(cur.fileSize), cur.meta].filter(Boolean).join(' · '), isImg: img(cur), canDl: real(cur.fileUrl),
      noPrev: !img(cur), noPrevText: real(cur.fileUrl) ? 'No preview is available for this file type. Download it to open it.' : 'The file itself is not available in this demo.' } : {};
    return { items, showView: ok, v, closeView: () => this.setState({ view: -1 }) };
  }
}
</script>
</body>
</html>

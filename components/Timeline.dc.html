<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:0;width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><sc-for list="{{ items }}" as="e" hint-placeholder-count="3"><div style="display:flex;gap:14px"><div style="flex:none;width:12px;display:flex;flex-direction:column;align-items:center"><span style="{{ e.dotStyle }}"></span><div style="{{ e.lineStyle }}"></div></div><div style="display:flex;flex-direction:column;gap:2px;min-width:0;padding-bottom:18px"><span style="font-size:14px;color:#111827;line-height:1.4;font-weight:{{ e.weight }}">{{ e.text }}</span><span style="font-size:12px;color:#6b7280">{{ e.meta }}</span><sc-if value="{{ e.hasFile }}" hint-placeholder-val="{{ false }}"><a href="{{ e.fileUrl }}" download="{{ e.fileName }}" style="display:inline-flex;align-items:center;gap:6px;width:fit-content;max-width:100%;margin-top:4px;background:#eaeef5;color:#25395c;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;text-decoration:none"><dc-import name="Icon" icon="paperclip" weight="regular" size="13" color="#25395c" hint-size="13px,13px"></dc-import>{{ e.fileName }}<sc-if value="{{ e.hasSize }}" hint-placeholder-val="{{ false }}"> · {{ e.fileSize }}</sc-if></a></sc-if></div></div></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:240},&quot;events&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ text: string, meta: string, dot?: string, fileName?: string, fileUrl?: string, fileSize?: string }[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const ev = Array.isArray(this.props.events) ? this.props.events : [];
    return { items: ev.map((e, i, arr) => ({ text: e.text || '', meta: e.meta || '', weight: i === 0 ? 700 : 400,
      hasFile: !!e.fileName, fileName: e.fileName || '', fileUrl: e.fileUrl || '#', fileSize: e.fileSize || '', hasSize: !!e.fileSize,
      dotStyle: 'margin-top:4px;flex:none;width:12px;height:12px;border-radius:999px;background:' + (e.dot || '#25395c') + (i === 0 ? ';box-shadow:0 0 0 4px #eaeef5' : ''),
      lineStyle: i === arr.length - 1 ? 'display:none' : 'flex:1;width:2px;background:#dfe3ea;margin:6px 0 2px;min-height:20px' })) };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.lo-frw{container-type:inline-size;container-name:lofr;width:100%}
.lo-fr{position:relative;z-index:0;isolation:isolate;display:grid;grid-template-columns:52px minmax(170px,1.3fr) minmax(212px,1fr) 130px;grid-template-rows:auto auto;column-gap:24px;row-gap:10px;padding:18px 20px;border-bottom:1px solid #dfe3ea;background:#fff;transition:background .12s;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#111827}
.lo-fr:has(.lo-dc-pop){z-index:5}
.lo-fr-s{background:#fafbfc}
.lo-fr:hover,.lo-fr-s:hover{background:#f4f6f9}
.lo-fr:hover .lo-dc,.lo-fr-s:hover .lo-dc{border-color:#c4cad4}
.lo-fr-dev{grid-row:1 / span 2;grid-column:3;align-self:center;justify-self:center}
.lo-fr-tail{display:contents}
.lo-fr-lock{grid-row:1;grid-column:4;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.lo-fr-view{grid-row:2;grid-column:4;justify-self:end;align-self:end}
.lo-fr-tt:hover .lo-fr-tip{display:block}
.lo-fr-tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:40;display:none;pointer-events:none}
.lo-fr-click,.lo-fr-click *{cursor:pointer!important}
@keyframes lo-fr-ping{0%{transform:scale(1);opacity:.4}100%{transform:scale(1.12,1.45);opacity:0}}
.lo-fr-ring{position:absolute;inset:0;z-index:-1;border-radius:999px;border:1.5px solid #92600a;pointer-events:none;animation:lo-fr-ping 2.8s ease-out infinite}
.lo-fr-ring.b{animation-delay:1.4s}
@media (prefers-reduced-motion:reduce){.lo-fr-ring{animation:none;opacity:.5}}
@container lofr (max-width:729px){.lo-fr{grid-template-columns:52px minmax(170px,1.3fr) minmax(172px,1fr) 112px;column-gap:14px;padding:14px}}
@container lofr (max-width:599px){.lo-fr{grid-template-columns:52px minmax(170px,1.3fr) minmax(148px,1fr) 112px}}
@container lofr (max-width:559px){.lo-fr{grid-template-columns:52px minmax(170px,1.3fr) minmax(132px,1fr) 112px}}
@container lofr (max-width:539px){.lo-fr{grid-template-columns:52px minmax(0,1fr) auto}.lo-fr-dev{grid-row:3;grid-column:2 / span 2;justify-self:start}.lo-fr-lock{grid-row:1;grid-column:3}.lo-fr-view{grid-row:2;grid-column:3}}
@container lofr (max-width:469px){.lo-fr{grid-template-columns:52px minmax(0,1fr)}.lo-fr-tail{grid-row:3;grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}.lo-fr-dev{grid-row:auto;grid-column:auto;justify-self:auto}.lo-fr-view{margin-left:auto}}
</style>
</helmet>
<div class="lo-frw"><div class="{{ rowCls }}">
  <div style="grid-row:1 / 3;grid-column:1;align-self:center;width:52px;height:52px;display:flex;align-items:center;justify-content:center">
    <sc-if value="{{ hasLogo }}" hint-placeholder-val="{{ false }}"><div role="img" aria-label="{{ school }} logo" style="{{ logoStyle }}"></div></sc-if>
    <sc-if value="{{ noLogo }}" hint-placeholder-val="{{ false }}"><div style="width:52px;height:52px;border-radius:10px;background:#eef0f3;display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="buildings" size="24" color="#9aa1ac" hint-size="24px,24px"></dc-import></div></sc-if>
  </div>
  <div style="grid-row:1;grid-column:2;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:17px;font-weight:700;color:#111827">{{ school }}</span>
    <sc-if value="{{ hasIssue }}" hint-placeholder-val="{{ false }}"><div style="margin:2px 0 0 -14px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px"><dc-import name="LinkButton" label="{{ issueText }}" icon="{{ issueIcon }}" tone="warning" onClick="{{ onIssue }}" hint-size="220px,34px"></dc-import>
      <sc-if value="{{ ackDone }}" hint-placeholder-val="{{ false }}"><span class="lo-fr-tt" style="position:relative;display:inline-flex;flex:none"><span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:#ecfdf3;cursor:default"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#027a48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3"></path></svg></span><span class="lo-fr-tip"><dc-import name="Tooltip" label="{{ ackTip }}" hint-size="0px,0px"></dc-import></span></span></sc-if>
      <sc-if value="{{ ackLive }}" hint-placeholder-val="{{ false }}"><dc-import name="Pill" label="{{ ackLabel }}" variant="success" size="s" icon="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3" hint-size="130px,26px"></dc-import></sc-if></div></sc-if></div>
  <div style="grid-row:2;grid-column:2;display:flex;flex-direction:column;gap:10px;min-width:0"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0"><div style="flex:none"><div class="{{ alertCls }}" onClick="{{ onAlert }}" title="{{ alertTip }}" style="position:relative;display:inline-flex"><sc-if value="{{ alert }}" hint-placeholder-val="{{ false }}"><span class="lo-fr-ring"></span><span class="lo-fr-ring b"></span></sc-if><dc-import name="Pill" label="{{ safetyLabel }}" variant="{{ safetyVariant }}" size="md" dot="{{ alert }}" hint-size="160px,30px"></dc-import></div></div><sc-if value="{{ healthy }}" hint-placeholder-val="{{ false }}"><div style="flex:none"><dc-import name="Pill" label="All devices healthy" variant="success" size="md" dot="{{ true }}" hint-size="200px,30px"></dc-import></div></sc-if></div></div>
  <div class="lo-fr-tail"><div class="lo-fr-dev"><dc-import name="DeviceCounts" items="{{ devices }}" total="{{ total }}" hint-size="212px,58px"></dc-import></div>
    <sc-if value="{{ hasLock }}" hint-placeholder-val="{{ false }}"><div class="lo-fr-lock" title="Last lockdown: {{ lastLock }}"><span style="font-size:30px;font-weight:700;line-height:1.1;color:#111827">{{ lockCount }}</span><span style="font-size:13px;color:#4b5563;white-space:nowrap">Recent lockdowns</span></div></sc-if>
    <div class="lo-fr-view"><dc-import name="Button" label="View" variant="secondary" height="34" onClick="{{ onView }}" hint-size="76px,34px"></dc-import></div></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:110},&quot;school&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bath Middle School&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;logo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;issueText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1 low battery&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;issueIcon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;battery-low&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ack&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;live&quot;,&quot;done&quot;],&quot;tsType&quot;:&quot;'live'|'done'&quot;},&quot;ackLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ackTip&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alertLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;No alerts&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alert&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;alertTip&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lockCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;lastLock&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;shaded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;devices&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ label, count, icon }[]&quot;},&quot;onIssue&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onAlert&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onView&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, none = () => {}, alert = p.alert === true || p.alert === 'true', lock = Number(p.lockCount) || 0;
    const issue = !!p.issueText, ack = p.ack || '';
    return { school: p.school || 'School', rowCls: 'lo-fr' + (p.shaded === true || p.shaded === 'true' ? ' lo-fr-s' : ''),
      hasLogo: !!p.logo, noLogo: !p.logo,
      logoStyle: 'box-sizing:border-box;width:52px;height:52px;border-radius:999px;border:1px solid #e5e7eb;background:#fff center / 68% no-repeat url(' + encodeURI(p.logo || '') + ')',
      hasIssue: issue, issueText: p.issueText || '', issueIcon: p.issueIcon || 'warning', onIssue: p.onIssue || none,
      ackDone: issue && ack === 'done', ackLive: issue && ack === 'live', ackLabel: p.ackLabel || 'Request raised', ackTip: p.ackTip || 'Request raised',
      alert, safetyLabel: p.alertLabel || 'No alerts', safetyVariant: alert ? 'warning' : 'tint',
      onAlert: p.onAlert || none, alertCls: p.onAlert ? 'lo-fr-click' : '', alertTip: p.alertTip || '',
      healthy: !issue, devices: Array.isArray(p.devices) ? p.devices : [], total: p.total,
      hasLock: lock > 0, lockCount: lock, lastLock: p.lastLock || '', onView: p.onView || none };
  }
}
</script>
</body>
</html>

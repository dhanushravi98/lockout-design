<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>.lo-sc-act,.lo-sc-act *{cursor:pointer!important}.lo-sc-act:hover{border-color:#b4bcc8!important}</style>
</helmet>
<div class="{{ cls }}" onClick="{{ onClick }}" style="box-sizing:border-box;min-width:0;width:100%;height:100%;min-height:88px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;transition:border-color .12s;font-family:-apple-system,BlinkMacSystemFont,sans-serif">
  <div style="{{ wrap }}"><dc-import name="Icon" icon="{{ icon }}" weight="fill" size="22" color="{{ color }}" hint-size="22px,22px"></dc-import></div>
  <div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:26px;font-weight:700;line-height:1.1;color:#111827">{{ value }}</span><span style="font-size:12px;line-height:1.25;color:#6b7280">{{ label }}</span></div>
  <sc-if value="{{ action }}" hint-placeholder-val="{{ false }}"><span title="View and raise a request" style="margin-left:auto;align-self:flex-start;flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;background:#fff7e0"><dc-import name="Icon" icon="arrow-up-right" weight="bold" size="13" color="#92600a" hint-size="13px,13px"></dc-import></span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:76},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;battery-low&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Low batteries&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;navy&quot;,&quot;options&quot;:[&quot;navy&quot;,&quot;warning&quot;,&quot;error&quot;],&quot;tsType&quot;:&quot;'navy'|'warning'|'error'&quot;},&quot;action&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, tone = p.tone || 'navy', act = p.action === true || p.action === 'true';
    const T = { navy: ['#25395c', '#eaeef5'], warning: ['#92600a', '#fff7e0'], error: ['#b91c1c', '#fef2f2'] }[tone] || ['#25395c', '#eaeef5'];
    return { icon: p.icon || 'buildings', value: p.value == null ? 0 : p.value, label: p.label || 'Label', action: act, cls: act ? 'lo-sc-act' : '', onClick: act && p.onClick ? p.onClick : () => {},
      color: T[0], wrap: 'flex:none;width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:' + T[1] };
  }
}
</script>
</body>
</html>

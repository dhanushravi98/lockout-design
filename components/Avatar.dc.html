<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="img" aria-label="{{ fullName }}" style="{{ style }}">{{ initials }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:52,&quot;height&quot;:52},&quot;fullName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lockout Admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:36,&quot;options&quot;:[36,44],&quot;tsType&quot;:&quot;36|44&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, name = p.fullName || 'Lockout Admin', s = Number(p.size) === 44 ? 44 : 36;
    const initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    const style = 'width:' + s + 'px;height:' + s + 'px;flex:none;border-radius:999px;background:#25395c;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:' + (s === 44 ? 14 : 12) + 'px;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
    return { fullName: name, initials, style };
  }
}
</script>
</body>
</html>

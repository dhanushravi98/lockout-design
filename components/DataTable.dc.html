<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow-x:auto;overflow-y:hidden;width:100%;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif">
  <div style="{{ innerStyle }}">
    <div style="{{ headStyle }}"><sc-for list="{{ cols }}" as="c" hint-placeholder-count="5"><span>{{ c }}</span></sc-for></div>
    <div style="{{ bodyStyle }}">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5"><div style="{{ rowStyle }}"><sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="5"><span style="{{ c.style }}">{{ c.v }}</span></sc-for></div></sc-for>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="padding:40px 20px;text-align:center;font-size:14px;color:#6b7280">{{ emptyText }}</div></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:300},&quot;columns&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(string|number)[][]&quot;},&quot;grid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0.35fr 0.5fr 1.5fr 2.6fr 1.8fr 1.3fr&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mono&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;strong&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;minWidth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:820,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;maxHeight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:360,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;emptyText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, cols = p.columns || ['ID', 'Zone', 'Device Name', 'Location', 'Device ID', 'App Version'], rows = p.rows || [];
    const tracks = (p.grid || 'repeat(' + cols.length + ',1fr)').replace(/(\d*\.?\d+)fr/g, 'minmax(0,$1fr)');
    const grid = 'display:grid;gap:12px;align-items:center;grid-template-columns:' + tracks;
    const mono = p.mono || [], strong = p.strong || [];
    return { cols, empty: rows.length === 0, emptyText: p.emptyText || 'No records to show.',
      innerStyle: 'min-width:' + (p.minWidth || 820) + 'px;display:flex;flex-direction:column',
      headStyle: grid + ';padding:14px 20px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#6b7280;border-bottom:1px solid #eef0f3;text-transform:uppercase;background:#fff',
      bodyStyle: 'max-height:' + (p.maxHeight || 360) + 'px;overflow-y:auto',
      rowStyle: grid + ';padding:15px 20px;font-size:14px;border-bottom:1px solid #f0f1f3;color:#111827',
      rows: rows.map(r => ({ cells: r.map((v, i) => ({ v, style: 'justify-self:start;min-width:0;max-width:100%;' + (mono.includes(i) ? 'color:#6b7280;font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:nowrap' : (strong.includes(i) ? 'font-weight:500;' : 'color:#374151;') + 'overflow-wrap:anywhere') })) })) };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ style }}" onClick="{{ toggle }}" role="button" aria-haspopup="menu" aria-label="Account menu"><sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><div onClick="{{ close }}" style="position:fixed;inset:0;z-index:40;cursor:default"></div><div role="menu" onClick="{{ stop }}" style="{{ popStyle }}"><div role="menuitem" onClick="{{ doAccount }}" style="{{ rowStyle }}" style-hover="background:#f4f6f9"><dc-import name="Icon" icon="user-gear" size="18" color="#25395c" hint-size="18px,18px"></dc-import>Account preferences</div><div role="menuitem" onClick="{{ doLogout }}" style="{{ rowStyle }}" style-hover="background:#f4f6f9"><dc-import name="Icon" icon="sign-out" size="18" color="#25395c" hint-size="18px,18px"></dc-import>Logout</div></div></sc-if><dc-import name="Avatar" full-name="{{ fullName }}" size="36" hint-size="36px,36px"></dc-import><sc-if value="{{ showText }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;min-width:0;flex-grow:1"><span style="font-size:13px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ fullName }}</span><span style="font-size:11px;font-weight:500;line-height:1.35;color:#6b7280">Last login: {{ lastLogin }}</span></div><dc-import name="IconButton" icon="gear" label="Account menu" size="30" onClick="{{ noop }}" hint-size="30px,30px"></dc-import></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:160},&quot;fullName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lockout Dev Super Admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lastLogin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Oct 16, 2026 · 3:03 PM&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onSettings&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onAccount&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onLogout&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const p = this.props, col = !!p.collapsed, open = this.state.open, none = () => {};
    const stop = e => { if (e && e.stopPropagation) e.stopPropagation(); };
    const style = (col
      ? 'display:flex;justify-content:center;padding:10px 0;width:100%;box-sizing:border-box;'
      : 'display:flex;align-items:center;gap:10px;padding:10px;width:100%;box-sizing:border-box;border:1px solid #e5e7eb;border-radius:16px;background:#fafbfc;') + 'position:relative;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
    return { fullName: p.fullName || 'Lockout Dev Super Admin', lastLogin: p.lastLogin || 'Oct 16, 2026 · 3:03 PM', showText: !col, style, open, noop: none, stop,
      popStyle: 'position:absolute;left:0;bottom:calc(100% + 8px);z-index:41;box-sizing:border-box;width:' + (col ? '220px' : '100%') + ';background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 12px 28px rgba(17,24,39,.16);padding:6px;display:flex;flex-direction:column;gap:2px;cursor:default',
      rowStyle: 'display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;color:#111827;cursor:pointer;user-select:none',
      toggle: () => { const o = !this.state.open; this.setState({ open: o }); if (o && p.onSettings) p.onSettings(); },
      close: e => { stop(e); this.setState({ open: false }); },
      doAccount: e => { stop(e); this.setState({ open: false }); if (p.onAccount) p.onAccount(); },
      doLogout: e => { stop(e); this.setState({ open: false }); if (p.onLogout) p.onLogout(); } };
  }
}
</script>
</body>
</html>

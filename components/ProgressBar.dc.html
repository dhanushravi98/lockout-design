<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="progressbar" aria-valuemin="0" aria-valuemax="{{ total }}" aria-valuenow="{{ value }}" style="box-sizing:border-box;width:100%;display:flex;flex-direction:column;gap:12px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#111827">
  <div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:26px;font-weight:700;line-height:1">{{ value }}</span><span style="font-size:15px;color:#4b5563">of {{ total }} {{ suffix }}</span></div>
  <div style="height:8px;border-radius:999px;background:#e8ebf0;overflow:hidden"><div style="{{ barStyle }}"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:64},&quot;value&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;tsType&quot;:&quot;number&quot;},&quot;suffix&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;completed&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, total = Math.max(0, Number(p.total) || 0), value = Math.min(total, Math.max(0, Number(p.value) || 0));
    return { value, total, suffix: p.suffix == null ? 'completed' : p.suffix,
      barStyle: 'height:100%;border-radius:999px;background:#25395c;transition:width .25s;width:' + (total ? Math.round(value / total * 100) : 0) + '%' };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.lo-ib-ghost:hover,.lo-ib-outline:hover{background:#eef2f8!important}
.lo-ib-ghost:active,.lo-ib-outline:active{background:#e1e8f3!important}
.lo-ib-danger:hover{background:#fee2e2!important}
.lo-ib-danger:active{background:#fecaca!important}
.lo-ib-live:focus-visible{box-shadow:0 0 0 3px rgba(37,57,92,.25)!important}
</style>
</helmet>
<div onClick="{{ onClick }}" title="{{ label }}" aria-label="{{ label }}" role="button" class="{{ cls }}" style="{{ style }}" tabindex="0"><dc-import name="Icon" icon="{{ icon }}" weight="{{ weight }}" size="{{ iconSize }}" color="currentColor" hint-size="16px,16px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:60,&quot;height&quot;:50},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;pencil-simple&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Edit&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ghost&quot;,&quot;options&quot;:[&quot;ghost&quot;,&quot;outline&quot;,&quot;danger&quot;],&quot;tsType&quot;:&quot;'ghost'|'outline'|'danger'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:32,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;weight&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;bold&quot;,&quot;options&quot;:[&quot;regular&quot;,&quot;bold&quot;,&quot;fill&quot;],&quot;tsType&quot;:&quot;'regular'|'bold'|'fill'&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;hover&quot;,&quot;pressed&quot;,&quot;focus&quot;,&quot;disabled&quot;],&quot;tsType&quot;:&quot;'hover'|'pressed'|'focus'|'disabled'&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, v = p.variant || 'ghost', size = p.size || 32, st = p.state, dis = !!p.disabled || st === 'disabled';
    const base = 'display:inline-flex;align-items:center;justify-content:center;flex:none;width:' + size + 'px;height:' + size + 'px;box-sizing:border-box;border-radius:999px;outline:none;color:#25395c;';
    let style = base + (dis ? 'color:#9aa1ac;background:transparent;border:1px solid transparent;cursor:not-allowed' : (v === 'danger' ? 'color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;cursor:pointer' : v === 'outline' ? 'background:#fff;border:1px solid #dfe3ea;cursor:pointer' : 'background:transparent;border:1px solid transparent;cursor:pointer'));
    if (!dis && st === 'hover') style += v === 'danger' ? ';background:#fee2e2' : ';background:#eef2f8';
    if (!dis && st === 'pressed') style += v === 'danger' ? ';background:#fecaca' : ';background:#e1e8f3';
    if (!dis && st === 'focus') style += ';box-shadow:0 0 0 3px rgba(37,57,92,.25)';
    return { icon: p.icon || 'pencil-simple', label: p.label || '', weight: p.weight || 'bold', iconSize: Math.round(size * 0.5), style,
      onClick: dis ? (() => {}) : (p.onClick || (() => {})), cls: dis || st ? '' : 'lo-ib-' + v + ' lo-ib-live' };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:6px;width:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif"><sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:600;color:#374151">{{ label }}<sc-if value="{{ required }}" hint-placeholder-val="{{ false }}"><span style="color:#ef4444"> *</span></sc-if></span></sc-if><input type="{{ type }}" value="{{ value }}" onInput="{{ onInput }}" placeholder="{{ placeholder }}" disabled="{{ disabled }}" style="{{ style }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" onMouseOver="{{ onEnter }}" onMouseOut="{{ onLeave }}"><sc-if value="{{ hasHelper }}" hint-placeholder-val="{{ false }}"><span style="{{ helperStyle }}">{{ helper }}</span></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:80},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;First name&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Search by name or room&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;text&quot;,&quot;options&quot;:[&quot;text&quot;,&quot;password&quot;],&quot;tsType&quot;:&quot;'text'|'password'&quot;},&quot;required&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;helper&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;rounded&quot;,&quot;options&quot;:[&quot;rounded&quot;,&quot;pill&quot;],&quot;tsType&quot;:&quot;'pill'|'rounded'&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:38,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;hover&quot;,&quot;focus&quot;,&quot;disabled&quot;,&quot;error&quot;],&quot;tsType&quot;:&quot;'hover'|'focus'|'disabled'|'error'&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onInput&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e: Event) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { foc: false, hov: false };
  renderVals() {
    const p = this.props, st = p.state, dis = !!p.disabled || st === 'disabled', err = p.error || (st === 'error' ? 'This field is required' : '');
    const pill = p.shape === 'pill';
    const H = 'border-color:#b4bcc8', F = 'border-color:#b4bcc8;background:#eaeef5';
    let style = 'width:100%;height:' + (p.height || 38) + 'px;box-sizing:border-box;border-width:1px;border-style:solid;border-color:#dfe3ea;border-radius:' + (pill ? 999 : 8) + 'px;padding:0 ' + (pill ? 16 : 12) + 'px;font-size:14px;font-family:inherit;color:#111827;background:#fff;outline:none';
    if (dis) style += ';background:#eef0f3;color:#9aa1ac;cursor:not-allowed';
    if (err) style += ';border-color:#ef4444';
    const isF = !dis && (st === 'focus' || (!st && this.state.foc)), isH = !dis && !isF && (st === 'hover' || (!st && this.state.hov));
    if (isH) style += ';' + H;
    if (isF) style += ';' + F;
    const helper = err || p.helper || '';
    return { type: p.type || 'text', value: p.value, onInput: p.onInput || (() => {}), placeholder: p.placeholder || '', disabled: dis, label: p.label, hasLabel: !!p.label, required: !!p.required, style,
      onFocus: () => this.setState({ foc: true }), onBlur: () => this.setState({ foc: false }), onEnter: () => { if (!this.state.hov) this.setState({ hov: true }); }, onLeave: () => { if (this.state.hov) this.setState({ hov: false }); }, helper, hasHelper: !!helper, helperStyle: 'font-size:12px;color:' + (err ? '#b91c1c' : '#6b7280') };
  }
}
</script>
</body>
</html>

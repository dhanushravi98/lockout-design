<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}"><div style="{{ wrapStyle }}"><div onClick="{{ close }}" style="position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:90"></div><div style="{{ panelStyle }}">
  <div style="flex:none;display:flex;align-items:flex-start;gap:12px;padding:22px 24px 14px;border-bottom:1px solid #eef0f3">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:10px"><span style="flex:none;white-space:nowrap;font-size:22px;font-weight:700">{{ title }}</span><sc-if value="{{ hasStatus }}" hint-placeholder-val="{{ false }}"><div style="flex:none"><dc-import name="Pill" label="{{ status }}" variant="{{ statusVariant }}" size="s" hint-size="150px,26px"></dc-import></div></sc-if></div><sc-for list="{{ lines }}" as="l" hint-placeholder-count="2"><span style="{{ l.style }}">{{ l.text }}</span></sc-for></div>
    <div style="flex:none;display:flex;align-items:center;gap:6px"><sc-if value="{{ canExpand }}" hint-placeholder-val="{{ false }}"><dc-import name="IconButton" icon="arrows-out-simple" label="Open full page" variant="outline" size="36" onClick="{{ expand }}" hint-size="36px,36px"></dc-import></sc-if><dc-import name="IconButton" icon="x" label="Close" size="36" onClick="{{ close }}" hint-size="36px,36px"></dc-import></div>
  </div>
  <div style="flex:1;min-height:0;overflow-y:auto;padding:18px 24px;display:flex;flex-direction:column;gap:22px">{{ body }}</div>
  <sc-if value="{{ hasActions }}" hint-placeholder-val="{{ false }}"><div style="flex:none;display:flex;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid #eef0f3"><sc-for list="{{ leftActions }}" as="a" hint-placeholder-count="0"><dc-import name="Button" label="{{ a.label }}" variant="{{ a.variant }}" icon="{{ a.icon }}" height="44" disabled="{{ a.disabled }}" onClick="{{ a.onClick }}" hint-size="150px,44px"></dc-import></sc-for><div style="flex:1"></div><sc-for list="{{ rightActions }}" as="a" hint-placeholder-count="2"><dc-import name="Button" label="{{ a.label }}" variant="{{ a.variant }}" icon="{{ a.icon }}" height="44" disabled="{{ a.disabled }}" onClick="{{ a.onClick }}" hint-size="130px,44px"></dc-import></sc-for></div></sc-if>
</div></div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:420},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SR-1046&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;In progress&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;statusVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;info&quot;,&quot;options&quot;:[&quot;tint&quot;,&quot;solid&quot;,&quot;success&quot;,&quot;warning&quot;,&quot;error&quot;,&quot;info&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;inline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:520,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;lines&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(string | { text: string, strong?: boolean })[]&quot;},&quot;actions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ label, variant?, icon?, side?: 'left'|'right', disabled?, onClick }[]&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onExpand&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, none = () => {}, acts = (Array.isArray(p.actions) ? p.actions : []).map(a => ({ label: a.label || '', variant: a.variant || 'secondary', icon: a.icon || '', disabled: !!a.disabled, onClick: a.onClick || none, side: a.side || 'right' }));
    const lines = (Array.isArray(p.lines) ? p.lines : []).map((l, i) => { const o = typeof l === 'string' ? { text: l } : l; return { text: o.text || '', style: i === 0 && !o.strong ? 'font-size:14px;color:#4b5563' : o.strong ? 'font-size:13px;font-weight:600;color:#374151' : 'font-size:13px;color:#6b7280' }; });
    const inl = p.inline === true || p.inline === 'true';
    return { wrapStyle: inl ? 'position:relative;width:100%;height:440px;overflow:hidden;border-radius:12px;background:#f4f6f9;transform:translateZ(0)' : 'display:contents', open: p.open !== false && p.open !== 'false', title: p.title || 'Title', hasStatus: !!p.status, status: p.status || '', statusVariant: p.statusVariant || 'tint', lines, body: p.children || null,
      canExpand: !!p.onExpand, expand: p.onExpand || none, close: p.onClose || none, hasActions: acts.length > 0, leftActions: acts.filter(a => a.side === 'left'), rightActions: acts.filter(a => a.side !== 'left'),
      panelStyle: 'position:fixed;top:0;right:0;bottom:0;width:' + (p.width || 520) + 'px;max-width:100%;background:#fff;box-shadow:-12px 0 40px rgba(17,24,39,.18);z-index:91;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;color:#111827' };
  }
}
</script>
</body>
</html>

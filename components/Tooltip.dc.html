<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span role="tooltip" style="display:inline-flex;align-items:center;white-space:nowrap;box-sizing:border-box;padding:6px 12px;border-radius:8px;background:#ffffff;border:1px solid #e5e7eb;box-shadow:0 8px 24px rgba(0,0,0,.12);font-size:13px;font-weight:600;color:#111827;font-family:-apple-system,BlinkMacSystemFont,sans-serif;">{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:40},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { label: this.props.label || 'Home' };
  }
}
</script>
</body>
</html>

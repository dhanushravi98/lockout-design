<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="box-sizing:border-box;width:100%;display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-bottom:1px solid #eef0f3;font-family:-apple-system,BlinkMacSystemFont,sans-serif">
  <div style="{{ wrap }}"><dc-import name="Icon" icon="{{ icon }}" size="18" color="{{ color }}" hint-size="18px,18px"></dc-import></div>
  <div style="min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600;color:#111827">{{ title }}</span><span style="font-size:12px;color:#6b7280">{{ where }} · {{ when }}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:66},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;wrench&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Service request SR-1043 raised&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;where&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bath Elementary · 2 devices&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;when&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Oct 23&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;navy&quot;,&quot;options&quot;:[&quot;navy&quot;,&quot;warm&quot;],&quot;tsType&quot;:&quot;'navy'|'warm'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, warm = p.tone === 'warm';
    return { icon: p.icon || 'wrench', title: p.title || 'Activity', where: p.where || '', when: p.when || '', color: warm ? '#92600a' : '#25395c',
      wrap: 'flex:none;width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:' + (warm ? '#fff7e0' : '#eaeef5') };
  }
}
</script>
</body>
</html>

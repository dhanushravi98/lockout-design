<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}"><div onClick="{{ onBackdrop }}" style="{{ overlayStyle }}"><div onClick="{{ stop }}" style="{{ boxStyle }}"><div style="flex:none;display:flex;align-items:center;gap:14px;padding:28px 32px 0"><sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><div style="width:44px;height:44px;border-radius:999px;background:#eaeef5;display:flex;align-items:center;justify-content:center;flex:none"><dc-import name="Icon" icon="{{ icon }}" weight="regular" size="22" color="#25395c" hint-size="22px,22px"></dc-import></div></sc-if><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:22px;font-weight:700;color:#111827">{{ title }}</span><sc-if value="{{ hasSubtitle }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ subtitle }}</span></sc-if></div><sc-if value="{{ showClose }}" hint-placeholder-val="{{ false }}"><dc-import name="IconButton" icon="x" label="Close" size="36" onClick="{{ onClose }}" hint-size="36px,36px"></dc-import></sc-if></div><div style="flex:1;min-height:0;overflow-y:auto;padding:18px 32px;display:flex;flex-direction:column;gap:16px"><sc-if value="{{ hasText }}" hint-placeholder-val="{{ false }}"><span style="font-size:15px;line-height:1.5;color:#374151">{{ bodyText }}</span></sc-if>{{ body }}</div><sc-if value="{{ showFooter }}" hint-placeholder-val="{{ true }}"><div style="flex:none;display:flex;justify-content:flex-end;gap:10px;padding:4px 32px 28px"><sc-if value="{{ showCancel }}" hint-placeholder-val="{{ true }}"><dc-import name="Button" label="{{ cancelLabel }}" variant="secondary" height="44" onClick="{{ onCancel }}" hint-size="110px,44px"></dc-import></sc-if><dc-import name="Button" label="{{ confirmLabel }}" variant="{{ confirmVariant }}" height="44" disabled="{{ confirmDisabled }}" onClick="{{ onConfirm }}" hint-size="110px,44px"></dc-import></div></sc-if></div></div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:300},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;inline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Add Wi-Fi network&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bodyText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dialog content goes here.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:460,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;cancelLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Cancel&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;confirmLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Confirm&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;confirmDisabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hideCancel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hideFooter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onCancel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onConfirm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, inline = !!p.inline, w = p.width || 460;
    return { open: p.open !== false && p.open !== 'false', title: p.title || 'Title', subtitle: p.subtitle, hasSubtitle: !!p.subtitle,
      icon: p.icon || '', hasIcon: !!p.icon, bodyText: p.bodyText || '', hasText: !!p.bodyText, body: p.children || null,
      showClose: !!p.onClose, onClose: p.onClose || (() => {}), onBackdrop: p.onClose || (() => {}), stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
      showFooter: !p.hideFooter, showCancel: !p.hideCancel, cancelLabel: p.cancelLabel || 'Cancel', confirmLabel: p.confirmLabel || 'Confirm', confirmDisabled: !!p.confirmDisabled, confirmVariant: p.confirmVariant || 'primary',
      onCancel: p.onCancel || (() => {}), onConfirm: p.onConfirm || (() => {}),
      overlayStyle: (inline ? 'position:relative;background:transparent;' : 'position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:100;') + 'display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#111827',
      boxStyle: 'width:' + w + 'px;max-width:100%;' + (p.height ? 'height:' + p.height + 'px;' : '') + 'max-height:92vh;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden' };
  }
}
</script>
</body>
</html>

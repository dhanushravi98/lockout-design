<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>.lo-tc{cursor:pointer}.lo-tc:hover{border-color:#b4bcc8!important;box-shadow:0 6px 18px rgba(17,24,39,.08)!important}.lo-tc-soon,.lo-tc-soon:hover{cursor:default!important;border-color:#eef0f3!important;box-shadow:0 1px 3px rgba(17,24,39,.05)!important}.lo-tc-play:hover{background:#1c2c48!important;transform:scale(1.06)}</style>
</helmet>
<div class="{{ cls }}" onClick="{{ open }}" style="box-sizing:border-box;min-width:0;width:100%;background:#fff;border:1px solid #eef0f3;border-radius:18px;padding:10px;box-shadow:0 1px 3px rgba(17,24,39,.05);display:flex;flex-direction:column;transition:border-color .12s,box-shadow .12s;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#111827">
  <div style="{{ coverStyle }}">
    <sc-if value="{{ noThumb }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;text-align:center;height:100%;box-sizing:border-box"><span style="font-size:15px;font-weight:800;letter-spacing:.02em;line-height:1.2;color:#25395c;text-transform:uppercase">{{ tile }}</span></div></sc-if>
    <div style="position:absolute;top:8px;left:8px"><dc-import name="Pill" label="{{ statusLabel }}" variant="{{ statusVariant }}" size="s" icon="{{ statusIcon }}" hint-size="100px,24px"></dc-import></div>
    <sc-if value="{{ canPlay }}" hint-placeholder-val="{{ true }}"><div class="lo-tc-play" style="position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:999px;background:#25395c;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(37,57,92,.25);transition:transform .12s,background .12s"><dc-import name="Icon" icon="play" weight="fill" size="14" color="#ffffff" hint-size="14px,14px"></dc-import></div></sc-if>
  </div>
  <div style="padding:16px 8px 6px;display:flex;flex-direction:column;gap:18px;flex:1">
    <span style="font-size:15px;font-weight:700;line-height:1.3;min-height:39px">{{ heading }}</span>
    <div style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:auto">
      <sc-if value="{{ handout }}" hint-placeholder-val="{{ false }}"><dc-import name="Button" label="Handout" variant="secondary" icon="file-text" size="sm" onClick="{{ handoutClick }}" hint-size="110px,34px"></dc-import></sc-if>
      <dc-import name="Button" label="{{ watchLabel }}" variant="{{ watchVariant }}" icon="play" size="sm" disabled="{{ soon }}" onClick="{{ open }}" hint-size="110px,34px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:300},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Administrative Safety Training Webinar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tile&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Admin safety training&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;new&quot;,&quot;options&quot;:[&quot;new&quot;,&quot;watched&quot;,&quot;soon&quot;],&quot;tsType&quot;:&quot;'new'|'watched'|'soon'&quot;},&quot;handout&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;thumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;s1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;index&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onHandout&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  GRAD = [['#eaf1fe', '#eaeef5'], ['#ecfdf3', '#eaf1fe'], ['#fff7e0', '#fef2f2'], ['#eaeef5', '#ecfdf3'], ['#fef2f2', '#eaeef5'], ['#fff7e0', '#ecfdf3'], ['#eaf1fe', '#fff7e0'], ['#eef2f8', '#fef2f2']];
  grad(seed, i) { let h = 0; for (const ch of String(seed || 'x')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const g = this.GRAD[(h + (Number(i) || 0) * 3) % this.GRAD.length], a = [110, 135, 160, 200][(h >> 3) % 4]; return 'linear-gradient(' + a + 'deg,' + g[0] + ' 0%,' + g[1] + ' 100%)'; }
  renderVals() {
    const p = this.props, st = p.state || 'new', soon = st === 'soon', w = st === 'watched', none = () => {};
    return { heading: p.heading || 'Training', tile: p.tile || p.heading || '', noThumb: !p.thumb, handout: p.handout === true || p.handout === 'true', soon, canPlay: !soon,
      cls: 'lo-tc' + (soon ? ' lo-tc-soon' : ''), open: soon ? none : (p.onOpen || none),
      handoutClick: e => { if (e && e.stopPropagation) e.stopPropagation(); if (p.onHandout) p.onHandout(); },
      coverStyle: 'position:relative;width:100%;aspect-ratio:16 / 9;overflow:hidden;border-radius:12px;background:' + (p.thumb ? 'center / cover no-repeat url("' + encodeURI(p.thumb) + '")' : this.grad(p.seed || p.heading, p.index)),
      statusLabel: soon ? 'Coming soon' : w ? 'Watched' : 'Not started', statusVariant: w ? 'success' : 'tint', statusIcon: w ? 'M20 6L9 17l-5-5' : '',
      watchLabel: w ? 'Watch again' : 'Watch', watchVariant: w ? 'secondary' : 'primary' };
  }
}
</script>
</body>
</html>

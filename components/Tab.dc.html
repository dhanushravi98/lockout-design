<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" style="{{ style }}" style-hover="{{ hover }}" style-active="{{ active }}" style-focus="{{ focus }}" tabindex="0"><sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><div style="width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center"><div style="{{ iconStyle }}"></div></div></sc-if><span style="font-size:13px;font-weight:600;white-space:nowrap">{{ label }}</span><sc-if value="{{ hasCount }}" hint-placeholder-val="{{ true }}"><span style="{{ countStyle }}">{{ count }}</span></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:50},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tablet List&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:110,&quot;tsType&quot;:&quot;number&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;uploads/Tablet Icon.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;iconWidth&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:22,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;iconHeight&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:22,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;hover&quot;,&quot;pressed&quot;,&quot;focus&quot;],&quot;tsType&quot;:&quot;'hover'|'pressed'|'focus'&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, on = !!p.selected, st = p.state, hasCount = p.count != null && p.count !== '';
    const H = 'background:rgba(255,255,255,.7)', A = 'background:rgba(255,255,255,.95)', F = 'box-shadow:inset 0 0 0 2px rgba(37,57,92,.35)';
    let style = 'display:inline-flex;align-items:center;gap:8px;padding:11px 14px 12px;border-radius:12px 12px 0 0;cursor:pointer;user-select:none;box-sizing:border-box;outline:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif;' + (on ? 'background:#fafbfc;color:#25395c;border:2px solid #25395c;border-bottom:2px solid #fafbfc' : 'background:transparent;color:#111827;border:2px solid transparent');
    if (!on && st === 'hover') style += ';' + H;
    if (!on && st === 'pressed') style += ';' + A;
    if (st === 'focus') style += ';' + F;
    return { label: p.label || 'Tab', count: p.count, hasCount, onClick: p.onClick || (() => {}), style,
      hasIcon: !!p.icon, iconStyle: 'width:' + (p.iconWidth || 22) + 'px;height:' + (p.iconHeight || 22) + 'px;flex:none;background:url("' + (p.icon || '') + '") center/contain no-repeat',
      hover: on || st ? '' : H, active: on || st ? '' : A, focus: st ? '' : F,
      countStyle: 'font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;' + (on ? 'background:#25395c;color:#fff' : 'background:#cfd5de;color:#111827') };
  }
}
</script>
</body>
</html>

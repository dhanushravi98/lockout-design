<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:flex-start;width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><sc-for list="{{ items }}" as="s" hint-placeholder-count="5"><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0"><div style="{{ s.line }}"></div><span style="{{ s.dot }}">{{ s.mark }}</span><span style="{{ s.text }}">{{ s.label }}</span></div></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:70},&quot;current&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:5,&quot;tsType&quot;:&quot;number&quot;},&quot;warn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;warnLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Action needed&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;steps&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, steps = Array.isArray(p.steps) && p.steps.length ? p.steps : ['Created', 'Assigned', 'In progress', 'Technician out', 'Resolved'];
    const cur = Math.max(0, Math.min(steps.length, Number(p.current) || 0)), warn = p.warn === true || p.warn === 'true';
    const items = steps.map((l, i) => { const n = i + 1, on = n <= cur, here = n === cur, w = here && warn;
      return { label: w ? (p.warnLabel || 'Action needed') : l, mark: on && !here ? '\u2713' : String(n),
        dot: 'z-index:1;width:28px;height:28px;box-sizing:border-box;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;' + (w ? 'background:#fff7e0;border:2px solid #d99a1d;color:#92600a' : on ? 'background:#25395c;border:2px solid #25395c;color:#fff' : 'background:#fff;border:2px solid #cbd2dc;color:#9aa1ac'),
        text: 'font-size:12px;text-align:center;' + (here ? 'font-weight:700;color:#111827' : 'color:#6b7280'),
        line: i === 0 ? 'display:none' : 'position:absolute;top:13px;right:50%;width:100%;height:2px;background:' + (on ? '#25395c' : '#e5e7eb') }; });
    return { items };
  }
}
</script>
</body>
</html>

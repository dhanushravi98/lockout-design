<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Main menu" style="{{ style }}">
<div style="display:flex;align-items:center;gap:10px;padding:6px 6px 16px 6px;overflow:hidden"><sc-if value="{{ hasLogo }}" hint-placeholder-val="{{ false }}"><img src="{{ logoSrc }}" alt="{{ logoAlt }}" style="width:32px;height:32px;flex-shrink:0;object-fit:contain"></sc-if><span style="{{ brandStyle }}">{{ brand }}</span></div>
<div style="display:flex;flex-direction:column;gap:2px"><sc-for list="{{ groups }}" as="group" hint-placeholder-count="5"><sc-if value="{{ group.divider }}" hint-placeholder-val="{{ false }}"><dc-import name="NavDivider" collapsed="{{ collapsed }}" hint-size="100%,17px"></dc-import></sc-if><sc-for list="{{ group.items }}" as="item" hint-placeholder-count="2"><dc-import name="NavItem" label="{{ item.label }}" icon="{{ item.icon }}" href="{{ item.href }}" active="{{ item.active }}" collapsed="{{ collapsed }}" on-click="{{ item.pick }}" hint-size="100%,44px"></dc-import></sc-for></sc-for></div>
<div style="flex-grow:1;min-height:24px"></div>
<dc-import name="ProfileCard" full-name="{{ fullName }}" last-login="{{ lastLogin }}" collapsed="{{ collapsed }}" hint-size="100%,58px"></dc-import>
<span style="position:absolute;left:100%;top:70px;margin-left:-1px;z-index:4"><dc-import name="SidebarToggle" collapsed="{{ collapsed }}" on-toggle="{{ toggle }}" hint-size="24px,44px"></dc-import></span>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:960},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;brand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;LockOut USA&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;logoSrc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fullName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lockout Dev Super Admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lastLogin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Oct 16, 2026 · 3:03 PM&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:960,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;groups&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ items: { label: string, icon: string, href?: string }[] }[]&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(label: string) =&gt; void&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(collapsed: boolean) =&gt; void&quot;}}">
const DEFAULT_GROUPS = [
  { items: [{ label: 'Home', icon: 'house' }] },
  { items: [{ label: 'School', icon: 'buildings' }, { label: 'Dispatch', icon: 'broadcast' }, { label: 'Reports', icon: 'file-text' }, { label: 'Texting', icon: 'chat-centered' }] },
  { items: [{ label: 'User Management', icon: 'users' }, { label: 'Services', icon: 'wrench' }] },
  { items: [{ label: 'Assessments', icon: 'clipboard-text' }, { label: 'Emergency Prep', icon: 'shield' }, { label: 'Trainings', icon: 'graduation-cap' }] },
  { items: [{ label: 'User Logs', icon: 'clock-counter-clockwise' }] }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { collapsed: null, active: null };
  }
  componentDidUpdate(prev) {
    // A prop change from the host wins over a click made inside the preview.
    if (prev.collapsed !== this.props.collapsed && this.state.collapsed !== null) this.setState({ collapsed: null });
    if (prev.active !== this.props.active && this.state.active !== null) this.setState({ active: null });
  }
  renderVals() {
    const p = this.props, self = this;
    const col = this.state.collapsed === null ? !!p.collapsed : this.state.collapsed;
    const active = this.state.active === null ? (p.active || 'Home') : this.state.active;
    const src = Array.isArray(p.groups) && p.groups.length ? p.groups : DEFAULT_GROUPS;
    const groups = src.map((g, gi) => ({ divider: gi > 0, items: (g.items || []).map(it => ({
      label: it.label, icon: it.icon, href: it.href || '#', active: it.label === active,
      pick: (e) => { if ((it.href || '#') === '#' && e && e.preventDefault) e.preventDefault(); self.setState({ active: it.label }); if (p.onNavigate) p.onNavigate(it.label); }
    })) }));
    const h = p.height || 960, brand = p.brand || 'LockOut USA';
    const style = 'position:relative;display:flex;flex-direction:column;width:' + (col ? 80 : 264) + 'px;height:' + h + 'px;box-sizing:border-box;padding:' + (col ? '16px 18px' : '16px 12px') + ';background:#ffffff;border-right:1px solid #e5e7eb;transition:width .24s ease,padding .24s ease;font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
    const brandStyle = 'font-size:17px;font-weight:700;color:#111827;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;transition:opacity .16s ease;opacity:' + (col ? 0 : 1);
    return { collapsed: col, groups, brand, brandStyle, hasLogo: !!p.logoSrc, logoSrc: p.logoSrc || '', logoAlt: brand + ' logo',
      fullName: p.fullName || 'Lockout Dev Super Admin', lastLogin: p.lastLogin || 'Oct 16, 2026 · 3:03 PM', style,
      toggle: () => { self.setState({ collapsed: !col }); if (p.onToggle) p.onToggle(!col); } };
  }
}
</script>
</body>
</html>

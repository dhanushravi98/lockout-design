<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;min-width:0;width:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
    <div style="display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0">
      <div style="width:44px;height:44px;border-radius:999px;background:#25395c;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">{{ initials }}</div>
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <div style="font-size:15px;font-weight:700;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px">{{ name }}</div>
        <div style="font-size:13px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px">{{ username }}</div>
        <span style="font-size:11px;font-weight:500;color:#9aa1ac;line-height:1.2">{{ rank }}</span>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:2px;min-width:0">
          <span style="font-size:11px;font-weight:600;white-space:nowrap;color:#25395c">{{ role }}</span>
          <div style="display:flex;align-items:center;gap:6px;min-width:0"><span style="display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;background:#f3f4f6;white-space:nowrap;color:#6b7280;font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:190px">{{ firstSchool }}</span>
            <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ false }}"><span onClick="{{ toggle }}" style="display:inline-flex;flex:none;align-items:center;justify-content:center;padding:3px 8px;border-radius:999px;background:#eef2f8;color:#25395c;font-size:11px;font-weight:700;min-width:26px;box-sizing:border-box;cursor:pointer" style-hover="background:#e1e8f3"><sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}">{{ moreText }}</sc-if><sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" icon="caret-up" weight="bold" size="10" color="currentColor" hint-size="10px,10px"></dc-import></sc-if></span></sc-if></div>
          <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px"><sc-for list="{{ restSchools }}" as="s" hint-placeholder-count="0"><span style="display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;background:#f3f4f6;white-space:nowrap;color:#6b7280;font-size:11px;font-weight:600">{{ s }}</span></sc-for></div></sc-if>
        </div>
      </div>
    </div>
    <span style="{{ statusStyle }}"><span style="{{ dotStyle }}"></span>{{ status }}</span>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:12px;color:#9aa1ac">{{ date }}</div>
    <div onClick="{{ onOpen }}" style="width:30px;height:30px;border-radius:999px;background:#25395c;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:#1c2c48" tabindex="0"><dc-import name="Icon" icon="caret-right" weight="bold" size="14" color="#fff" hint-size="14px,14px"></dc-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:220},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Pavan Sai Lankalapalli&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;username&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;pavan.lankalapalli&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rank&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Primary&quot;,&quot;options&quot;:[&quot;Primary&quot;,&quot;Secondary&quot;],&quot;tsType&quot;:&quot;'Primary'|'Secondary'&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;District Admin&quot;,&quot;options&quot;:[&quot;Super Admin&quot;,&quot;District Admin&quot;,&quot;Facility Admin&quot;,&quot;Facility User&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;schools&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The Lockout Co, Annapolis High School&quot;,&quot;tsType&quot;:&quot;string[] | string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Active&quot;,&quot;options&quot;:[&quot;Active&quot;,&quot;Deactivated&quot;],&quot;tsType&quot;:&quot;'Active'|'Deactivated'&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sep 14, 2026 · 10:19 AM&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const p = this.props, name = p.fullName || 'Pavan Sai Lankalapalli';
    const list = Array.isArray(p.schools) ? p.schools : String(p.schools || '').split(',').map(x => x.trim()).filter(Boolean);
    const rest = list.slice(1), act = p.status !== 'Deactivated', open = this.state.open;
    const initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    return { name, username: p.username || '', rank: p.rank || 'Primary', role: p.role || 'District Admin', date: p.date || '', status: act ? 'Active' : 'Deactivated', initials,
      firstSchool: list[0] || '', hasMore: rest.length > 0, restSchools: rest, moreText: '+' + rest.length, open, closed: !open, toggle: () => this.setState(s => ({ open: !s.open })), onOpen: p.onOpen || (() => {}),
      statusStyle: 'display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;flex:none;' + (act ? 'background:#ecfdf3;color:#027a48' : 'background:#fef2f2;color:#b91c1c'),
      dotStyle: 'width:6px;height:6px;border-radius:999px;background:' + (act ? '#12b76a' : '#ef4444') };
  }
}
</script>
</body>
</html>

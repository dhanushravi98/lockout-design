<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.lo-navitem-live:hover{background:#f4f6f9!important;color:#111827!important}
.lo-navitem-live:active{background:#e8ebf0!important}
.lo-navitem-active.lo-navitem-live:hover{background:#eaeef5!important;color:#25395c!important}
.lo-navitem-active.lo-navitem-live:active{background:#d5def0!important}
.lo-navitem-live:focus-visible{box-shadow:0 0 0 3px rgba(37,57,92,.25)!important}
.lo-navitem-live:hover .lo-navitem-tip,.lo-navitem-live:focus-visible .lo-navitem-tip{display:block!important}
</style>
</helmet>
<a href="{{ href }}" onClick="{{ onClick }}" class="{{ cls }}" style="{{ style }}" aria-current="{{ current }}" aria-label="{{ label }}"><dc-import name="Icon" icon="{{ icon }}" weight="{{ weight }}" size="24" color="currentColor" hint-size="24px,24px"></dc-import><sc-if value="{{ showLabel }}" hint-placeholder-val="{{ true }}"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ label }}</span></sc-if><sc-if value="{{ collapsed }}" hint-placeholder-val="{{ false }}"><span class="lo-navitem-tip" style="{{ tipStyle }}"><dc-import name="Tooltip" label="{{ label }}" hint-size="80px,30px"></dc-import></span></sc-if></a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:48},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;house&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;hover&quot;,&quot;pressed&quot;,&quot;focus&quot;],&quot;tsType&quot;:&quot;'hover'|'pressed'|'focus'&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    // Real hover, press and focus come from the classes in <helmet>: support.js does not fill {{ }} values in style-hover/active/focus.
    const p = this.props, on = !!p.active, col = !!p.collapsed, st = p.state || '';
    const base = 'position:relative;display:flex;align-items:center;gap:12px;height:44px;width:' + (col ? '44px' : '100%') + ';box-sizing:border-box;padding:0 10px;border-radius:999px;text-decoration:none;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;outline:none;cursor:pointer;';
    let style = base + (on ? 'background:#eaeef5;color:#25395c;font-weight:600' : 'background:transparent;color:#374151;font-weight:400');
    if (st === 'hover' && !on) style += ';background:#f4f6f9;color:#111827';
    if (st === 'pressed') style += on ? ';background:#d5def0' : ';background:#e8ebf0';
    if (st === 'focus') style += ';box-shadow:0 0 0 3px rgba(37,57,92,.25)';
    const tipStyle = 'position:absolute;left:56px;top:50%;transform:translateY(-50%);z-index:5;pointer-events:none;display:' + (st === 'hover' || st === 'focus' ? 'block' : 'none');
    return { label: p.label || 'Home', icon: p.icon || 'house', weight: on ? 'fill' : 'regular', href: p.href || '#', collapsed: col, showLabel: !col,
      current: on ? 'page' : 'false', onClick: p.onClick || (() => {}), style, tipStyle, cls: st ? '' : 'lo-navitem-live' + (on ? ' lo-navitem-active' : '') };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.lo-radio-live:focus-visible{box-shadow:0 0 0 3px rgba(37,57,92,.25)!important}
</style>
</helmet>
<div onClick="{{ onSelect }}" style="display:inline-flex;align-items:center;gap:10px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer"><div style="{{ style }}" style-hover="{{ hover }}" style-active="{{ active }}" class="{{ cls }}" tabindex="0"><sc-if value="{{ selected }}" hint-placeholder-val="{{ false }}"><div style="{{ dot }}"></div></sc-if></div><sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;color:#111827">{{ label }}</span></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:30},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Read-write&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;hover&quot;,&quot;pressed&quot;,&quot;focus&quot;,&quot;disabled&quot;],&quot;tsType&quot;:&quot;'hover'|'pressed'|'focus'|'disabled'&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, on = !!p.selected, st = p.state, dis = !!p.disabled || st === 'disabled';
    const H = 'border-color:#25395c;background:#f4f6f9', A = 'background:#e8ebf0;border-color:#25395c', F = 'box-shadow:0 0 0 3px rgba(37,57,92,.25)';
    let style = 'width:20px;height:20px;border-radius:999px;flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center;outline:none;' + (dis ? 'background:#e8ebf0;border:1px solid #dfe3ea' : (on ? 'background:#fff;border:1.5px solid #25395c' : 'background:#fff;border:1px solid #c4cad4'));
    if (!dis && st === 'hover') style += ';' + H;
    if (!dis && st === 'pressed') style += ';' + A;
    if (!dis && st === 'focus') style += ';' + F;
    return { selected: on, label: p.label, hasLabel: !!p.label, onSelect: dis ? (() => {}) : (p.onSelect || (() => {})), style, hover: dis || st ? '' : H, active: dis || st ? '' : A, cls: dis || st ? '' : 'lo-radio-live',
      dot: 'width:10px;height:10px;border-radius:999px;background:' + (dis ? '#9aa1ac' : '#25395c') };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.lo-dc{position:relative;width:212px;min-height:58px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:14px;padding:9px 14px;background:#fff;border:1px solid #dfe3ea;border-radius:12px;transition:border-color .12s;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.lo-dc-item{width:34px;display:flex;flex-direction:column;align-items:center;gap:5px}
.lo-dc-btn{display:none;align-items:center;gap:6px;height:30px;box-sizing:border-box;padding:0 12px;border-radius:999px;background:#fff;border:1px solid #dfe3ea;font-size:13px;font-weight:700;color:#25395c;cursor:pointer;white-space:nowrap}
.lo-dc-btn:hover{border-color:#b4bcc8;background:#fafbfc}
.lo-dc-p12{display:none!important}
@container lofr (max-width:729px){.lo-dc{width:172px;gap:10px;padding:9px 10px}.lo-dc-item{width:30px}}
@container lofr (max-width:599px){.lo-dc{width:148px}.lo-dc-i34{display:none}.lo-dc-more{display:inline-flex}}
@container lofr (max-width:559px){.lo-dc{width:132px}.lo-dc-i12{display:none}.lo-dc-more{display:none}.lo-dc-all{display:inline-flex}.lo-dc-p12{display:flex!important}}
@container lofr (min-width:600px){.lo-dc-pop,.lo-dc-back{display:none}}
</style>
</helmet>
<div class="lo-dc">
  <sc-for list="{{ items }}" as="b" hint-placeholder-count="4"><div class="lo-dc-item {{ b.cls }}" title="{{ b.label }}"><span style="{{ b.iconStyle }}"></span><span style="font-size:16px;font-weight:700;color:#111827;line-height:1">{{ b.count }}</span></div></sc-for>
  <div class="lo-dc-btn lo-dc-more" onClick="{{ toggle }}" role="button" aria-label="Show remaining device counts">{{ moreText }}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="{{ chev }}"><path d="M6 9l6 6 6-6"></path></svg></div>
  <div class="lo-dc-btn lo-dc-all" onClick="{{ toggle }}" role="button" aria-label="Show device counts">{{ totalText }}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="{{ chev }}"><path d="M6 9l6 6 6-6"></path></svg></div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><div class="lo-dc-back" onClick="{{ close }}" style="position:fixed;inset:0;z-index:30"></div><div class="lo-dc-pop" style="position:absolute;top:100%;right:0;margin-top:6px;z-index:31;min-width:224px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 12px 28px rgba(17,24,39,.14);padding:6px"><sc-for list="{{ popRows }}" as="h" hint-placeholder-count="0"><div class="{{ h.pcls }}" style="display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px" style-hover="background:#f4f6f9"><span style="{{ h.iconStyle }}"></span><span style="flex:1;font-size:14px;color:#111827">{{ h.label }}</span><span style="font-size:15px;font-weight:700;color:#111827">{{ h.count }}</span></div></sc-for></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:90},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ label: string, count: number, icon: string }[]&quot;},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const p = this.props, src = Array.isArray(p.items) ? p.items : [], open = this.state.open;
    const ist = (icon, size, pad) => 'display:block;flex:none;width:' + size + 'px;height:' + size + 'px;margin:' + pad + 'px 0;background:center / contain no-repeat url("' + encodeURI(icon || '') + '")';
    const items = src.map((x, i) => { const sz = i === 1 ? 17.6 : 22; return { cls: i < 2 ? 'lo-dc-i12' : 'lo-dc-i34', pcls: i < 2 ? 'lo-dc-p12' : '', count: x.count, label: x.label, iconStyle: ist(x.icon, sz, i === 1 ? 2.2 : 0), hIconStyle: ist(x.icon, Math.round(sz * 0.8), 0) }; });
    const total = p.total != null ? p.total : src.reduce((a, x) => a + (Number(x.count) || 0), 0);
    return { items, popRows: items.map(h => ({ ...h, iconStyle: h.hIconStyle })), open, moreText: '+' + Math.max(0, items.length - 2), totalText: total + ' devices',
      chev: 'flex:none;transition:transform .15s;transform:rotate(' + (open ? 180 : 0) + 'deg)', toggle: () => this.setState(s => ({ open: !s.open })), close: () => this.setState({ open: false }) };
  }
}
</script>
</body>
</html>

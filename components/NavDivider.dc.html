<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div aria-hidden="true" style="{{ style }}"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:17},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const col = !!this.props.collapsed;
    return { style: col ? 'width:32px;height:1px;background:#eef0f3;margin:8px auto' : 'height:1px;background:#eef0f3;margin:8px 10px' };
  }
}
</script>
</body>
</html>

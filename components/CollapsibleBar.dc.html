<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;box-sizing:border-box;background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#111827"><div onClick="{{ toggle }}" role="button" aria-expanded="{{ isOpen }}" style="{{ headStyle }}" style-hover="background:#fafbfc"><dc-import name="Icon" icon="{{ icon }}" weight="fill" size="20" color="#25395c" hint-size="20px,20px"></dc-import><span style="font-size:16px;font-weight:700">{{ title }}</span><span style="font-size:14px;color:#6b7280;flex:1">{{ hint }}</span><span style="flex:none;width:30px;height:30px;box-sizing:border-box;border-radius:999px;border:1px solid #cbd2dc;background:#fff;display:inline-flex;align-items:center;justify-content:center"><span style="{{ chevStyle }}"><dc-import name="Icon" icon="caret-down" weight="bold" size="14" color="#374151" hint-size="14px,14px"></dc-import></span></span></div><div style="{{ bodyOuter }}"><div style="{{ bodyInner }}">{{ body }}<sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}"><div style="padding:12px 20px;font-size:13px;color:#6b7280;background:#fafbfc">{{ note }}</div></sc-if></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:64},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;wrench&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Fix it yourself&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;3 guides&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Cannot fix it yourself? Use Report an issue above.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(open: boolean) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const p = this.props, ctl = p.open === true || p.open === false, o = ctl ? p.open : (this.state.open || p.defaultOpen === true);
    return { icon: p.icon || 'wrench', title: p.title || 'Fix it yourself', hint: p.hint || '', isOpen: o ? 'true' : 'false', body: p.children || null, hasNote: !!p.note, note: p.note || '',
      headStyle: 'display:flex;align-items:center;gap:10px;padding:10px 12px 10px 20px;cursor:pointer;user-select:none;border-bottom:1px solid ' + (o ? '#eef0f3' : 'transparent'),
      chevStyle: 'display:inline-flex;transition:transform .28s ease;transform:rotate(' + (o ? 180 : 0) + 'deg)',
      bodyOuter: 'display:grid;transition:grid-template-rows .28s ease;grid-template-rows:' + (o ? '1fr' : '0fr'),
      bodyInner: 'overflow:hidden;min-height:0;transition:visibility .28s;visibility:' + (o ? 'visible' : 'hidden'),
      toggle: () => { if (!ctl) this.setState(s => ({ open: !s.open })); if (p.onToggle) p.onToggle(!o); } };
  }
}
</script>
</body>
</html>

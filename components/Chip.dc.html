<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.lo-chip-live:focus-visible{box-shadow:0 0 0 3px rgba(37,57,92,.25)!important}
</style>
</helmet>
<span onClick="{{ onClick }}" style="{{ style }}" style-hover="{{ hover }}" style-active="{{ active }}" class="{{ cls }}" tabindex="0"><sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" icon="{{ icon }}" weight="fill" size="14" color="currentColor" hint-size="14px,14px"></dc-import></sc-if>{{ label }}<sc-if value="{{ hasCount }}" hint-placeholder-val="{{ false }}"><span style="{{ countStyle }}">{{ count }}</span></sc-if><sc-if value="{{ removable }}" hint-placeholder-val="{{ false }}"><span onClick="{{ onRemoveClick }}" style="{{ xStyle }}" style-hover="{{ xHover }}"><dc-import name="Icon" icon="x" weight="bold" size="10" color="currentColor" hint-size="10px,10px"></dc-import></span></sc-if></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:40},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Replace charger&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;removable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;error&quot;,&quot;warning&quot;],&quot;tsType&quot;:&quot;'error'|'warning'&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;hover&quot;,&quot;pressed&quot;,&quot;focus&quot;],&quot;tsType&quot;:&quot;'hover'|'pressed'|'focus'&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onRemove&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, on = !!p.selected, st = p.state;
    const T = { error: { off: 'background:#fef2f2;color:#b91c1c;border-color:#fecaca', on: 'background:#b91c1c;color:#fff;border-color:#b91c1c', ho: 'background:#fee2e2;border-color:#f5b5b5', hn: 'background:#991b1b;border-color:#991b1b', ao: 'background:#fecaca;border-color:#f5b5b5', an: 'background:#7f1d1d;border-color:#7f1d1d', x: '#b91c1c', xb: 'background:#fee2e2' }, warning: { off: 'background:#fff7e0;color:#92600a;border-color:#f6e4b0', on: 'background:#f5c242;color:#4a3200;border-color:#e0a823', ho: 'background:#fdeec0;border-color:#e8cf86', hn: 'background:#f0b429;border-color:#d99a1d', ao: 'background:#fbe3a0;border-color:#e8cf86', an: 'background:#e8a91c;border-color:#c98f12', x: '#92600a', xb: 'background:#fdeec0' } }[p.tone];
    const H = T ? (on ? T.hn : T.ho) : on ? 'background:#1c2c48;border-color:#1c2c48' : 'background:#f4f6f9;border-color:#b4bcc8';
    const A = T ? (on ? T.an : T.ao) : on ? 'background:#15233b;border-color:#15233b' : 'background:#e8ebf0;border-color:#b4bcc8';
    const F = 'box-shadow:0 0 0 3px rgba(37,57,92,.25)';
    let style = 'display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer;user-select:none;outline:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:' + (p.removable ? '6px 8px 6px 14px' : '6px 14px') + ';border-width:1px;border-style:solid;' + (T ? (on ? T.on : T.off) : on ? 'background:#25395c;color:#fff;border-color:#25395c' : 'background:#fff;color:#374151;border-color:#d5dae2');
    if (st === 'hover') style += ';' + H;
    if (st === 'pressed') style += ';' + A;
    if (st === 'focus') style += ';' + F;
    const hasCount = p.count != null && p.count !== '';
    return { label: p.label || 'Chip', count: p.count, hasCount, icon: p.icon || '', hasIcon: !!p.icon, removable: !!p.removable, onClick: p.onClick || (() => {}), style,
      onRemoveClick: (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (p.onRemove) p.onRemove(); },
      xStyle: 'display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:999px;margin-left:2px;cursor:pointer;color:' + (T ? (on && p.tone === 'error' ? '#fff' : T.x) : on ? '#fff' : '#6b7280'),
      xHover: on ? 'background:rgba(255,255,255,.2)' : 'background:#e8ebf0',
      hover: st ? '' : H, active: st ? '' : A, cls: st ? '' : 'lo-chip-live',
      countStyle: 'border-radius:999px;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:' + (on ? '#fff' : '#eaeef5') + ';color:#25395c' };
  }
}
</script>
</body>
</html>

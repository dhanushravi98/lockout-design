<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="status" style="{{ style }}"><div style="width:40px;height:40px;border-radius:999px;background:#25395c;display:flex;align-items:center;justify-content:center;flex:none"><dc-import name="Icon" icon="{{ icon }}" weight="fill" size="20" color="#ffffff" hint-size="20px,20px"></dc-import></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700;color:#111827">{{ title }}</span><sc-if value="{{ hasSub }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;color:#6b7280">{{ subtitle }}</span></sc-if></div><sc-if value="{{ showClose }}" hint-placeholder-val="{{ true }}"><dc-import name="IconButton" icon="x" label="Close" size="32" onClick="{{ onClose }}" hint-size="32px,32px"></dc-import></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:80},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Maintenance mode enabled&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ADRIAN MADISON SCHOOLS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;wrench&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;floating&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, fl = p.floating === true || p.floating === 'true';
    return { title: p.title || 'Done', subtitle: p.subtitle || '', hasSub: !!p.subtitle, icon: p.icon || 'wrench', showClose: !!p.onClose, onClose: p.onClose || (() => {}),
      style: (fl ? 'position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:90;max-width:calc(100vw - 32px);' : '') + 'box-sizing:border-box;width:420px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 12px 32px rgba(17,24,39,.16);padding:14px 14px 14px 16px;display:flex;align-items:center;gap:14px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#111827' };
  }
}
</script>
</body>
</html>
